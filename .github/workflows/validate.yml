name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:  # used by release.yml, so a release only happens when everything passes

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master on 2026-11-09

  code:
    name: Code style and logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python style (ruff)
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .
      - name: JavaScript style (prettier)
        run: npx --yes prettier@3.6.2 --check "custom_components/**/*.js" "tests/js/*.js"
      - name: Python logic tests
        run: python3 tests/test_logic.py
      - name: JavaScript tests
        run: npm test

  pytest:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Home Assistant test environment
        run: |
          pip install pytest-homeassistant-custom-component
          # the integration depends on the frontend, which needs its package in the matching version
          frontend=$(python -c "import homeassistant, json, pathlib; m = pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json'; print(json.loads(m.read_text())['requirements'][0])")
          pip install "$frontend"
      - name: Run tests
        run: |
          set -o pipefail
          pytest -v --tb=short 2>&1 | tee pytest.log
      - name: Test results as annotation
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          python3 scripts/pytest_annotation.py pytest.log "$([ "${{ job.status }}" = "success" ] && echo notice || echo error)"

  hacs:
    name: HACS
    # HACS can only read public repositories; skipped while the repository is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
