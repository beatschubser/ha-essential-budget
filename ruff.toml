# Python style: checked in the GitHub workflow (ruff check, ruff format --check)
line-length = 140
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]  # the texts use × and …

[lint.isort]
known-first-party = ["custom_components", "logic"]
